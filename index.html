<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0015; color:#e0d0ff; font-family:'Inter',sans-serif; overflow:hidden; height:100vh; width:100vw; }
#canvas-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
#main-svg  { position:relative; z-index:1; display:block; }

#header {
  position:fixed; top:0; left:0; right:0; padding:14px 32px 8px;
  z-index:200; background:linear-gradient(to bottom,rgba(10,0,21,.97) 55%,transparent);
}
#header h1 { font-size:1.15rem; font-weight:600; letter-spacing:6px; color:#ff6bd6; font-family:'Orbitron',sans-serif; text-shadow:0 0 20px rgba(255,107,214,.5),0 0 40px rgba(255,107,214,.2); }
#header p  { font-size:.7rem; color:#6a4a8a; letter-spacing:2px; margin-top:2px; font-family:'Orbitron',sans-serif; }

#sidebar {
  position:fixed; left:0; top:68px; bottom:0; width:210px; z-index:150;
  padding:12px 10px; background:linear-gradient(to right,rgba(10,0,21,.96) 78%,transparent);
  display:flex; flex-direction:column; gap:5px; overflow-y:auto;
}
#sidebar h3 {

  text-transform:uppercase; margin:0 0 11px 1px; flex-shrink:0;
  font-family:'Orbitron',sans-serif;
  text-shadow:0 0 10px rgba(255,107,214,.3);
}
#sidebar > h3 { margin-top:8px; }
.theme-btn {
  display:flex; align-items:center; gap:9px; padding:8px 11px;
  border:1px solid rgba(255,107,214,.08); border-radius:24px;
  background:rgba(255,255,255,.02); cursor:pointer; font-family:'Inter',sans-serif;
  font-size:.7rem; color:#8a6aaa; transition:all .2s; text-align:left;
}
.theme-btn:hover { background:rgba(255,107,214,.08); color:#e0d0ff; border-color:rgba(255,107,214,.2); }
.theme-btn.active { background:rgba(255,107,214,.12); color:#fff; border-color:rgba(255,107,214,.3); box-shadow:0 0 12px rgba(255,107,214,.15); }
.btn-icon  { font-size:1rem; flex-shrink:0; width:20px; text-align:center; }
.btn-label { flex:1; line-height:1.3; }
.btn-count { font-size:.62rem; color:#6a4a8a; background:rgba(255,107,214,.06); padding:2px 7px; border-radius:9px; }
.theme-btn.active .btn-count { color:#ff6bd6; }

#conn-toggle {
  margin-top:22px; padding:8px 11px; border:1px solid rgba(0,212,255,.12);
  border-radius:24px; background:rgba(0,212,255,.04); cursor:pointer;

}
#conn-toggle:hover { background:rgba(0,212,255,.1); color:#00d4ff; }
#conn-toggle.on { background:rgba(0,212,255,.12); color:#00d4ff; border-color:rgba(0,212,255,.3); box-shadow:0 0 12px rgba(0,212,255,.15); }

#tooltip {
  position:fixed; z-index:500; background:rgba(10,0,21,.97);
  border:1px solid rgba(255,107,214,.2); border-radius:10px; padding:13px 17px;
  max-width:360px; pointer-events:none; opacity:0; transform:translateY(5px);
  transition:opacity .15s,transform .15s; backdrop-filter:blur(12px);

}
#tooltip.visible { opacity:1; transform:translateY(0); }
.tt-authors{ font-size:.72rem; font-weight:600; margin-bottom:3px; line-height:1.4; }
.tt-journal{ font-size:.68rem; font-style:italic; margin-bottom:6px; color:#00d4ff; }

.tool-sep { margin-top:46px; margin-bottom:0; padding-top:16px; border-top:1px solid rgba(255,107,214,.13); flex-shrink:0; }
.tool-btn {
  display:flex; align-items:center; gap:8px; padding:7px 11px;
  border:1px solid rgba(255,255,255,.07); border-radius:24px;
  background:rgba(255,255,255,.02); cursor:pointer; font-family:'Inter',sans-serif;
  font-size:.68rem; color:#8a6aaa; transition:all .2s; text-align:left; width:100%;
}
.tool-btn:hover { background:rgba(255,107,214,.08); color:#e0d0ff; }
.tool-btn.on { background:rgba(255,107,214,.1); color:#ff6bd6; border-color:rgba(255,107,214,.25); }
#search-input {
  display:none; width:100%; padding:6px 10px; margin-top:4px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,107,214,.15);
  border-radius:12px; color:#e0d0ff; font-family:'Inter',sans-serif; font-size:.7rem;

}
#search-input.visible { display:block; }
#search-input::placeholder { color:#6a4a8a; }

}

#pl-back {
  display:flex; align-items:center; gap:7px; flex-shrink:0;

}
#pl-back:hover { color:#ff6bd6; background:rgba(255,107,214,.06); }
#pl-heading { font-size:.62rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:5px; padding:0 4px; flex-shrink:0; font-family:'Orbitron',sans-serif; }
#pl-count   { font-size:.6rem; color:#6a4a8a; letter-spacing:1px; margin-bottom:10px; padding:0 4px; flex-shrink:0; }
.pl-item {
  padding:7px 9px; border-radius:8px; margin-bottom:4px; flex-shrink:0;

  transition:background .15s;
}
.pl-item:hover { background:rgba(255,107,214,.06); }
.pl-item[data-doi] { cursor:pointer; }
.pl-meta  { font-size:.62rem; margin-bottom:2px; }
.pl-journal{ font-size:.61rem; font-style:italic; color:#00d4ff; margin-bottom:3px; }
.pl-title { font-size:.67rem; color:#b0a0d0; line-height:1.45; }

@keyframes hub-pulse {
  0%,100% { stroke-opacity:.4; }
  50%      { stroke-opacity:.8; }
}
.hub-pulse { animation: hub-pulse 3.5s ease-in-out infinite; }

@keyframes neon-flicker {
  0%,100% { opacity:.6; }
  10% { opacity:.8; }
  20% { opacity:.5; }
  50% { opacity:1; }
  60% { opacity:.7; }
  80% { opacity:.9; }
}

@keyframes cite-pulse {
  0%,100% { transform:scale(1); filter:drop-shadow(0 0 4px currentColor); }
  50% { transform:scale(1.15); filter:drop-shadow(0 0 8px currentColor); }
}
.cite-icon-dynamic {
  display:inline-block; animation:cite-pulse 2s ease-in-out infinite;
  font-size:.85rem; line-height:1;
}

#music-ctrl {
  display:flex; align-items:center; gap:8px; padding:7px 11px;
  border:1px solid rgba(0,212,255,.1); border-radius:24px;
  background:rgba(0,212,255,.03); cursor:pointer; font-family:'Inter',sans-serif;
  font-size:.68rem; color:#6a8aaa; transition:all .2s; text-align:left; width:100%;
  margin-top:4px;
}
#music-ctrl:hover { background:rgba(0,212,255,.08); color:#00d4ff; }
#music-ctrl.on { background:rgba(0,212,255,.1); color:#00d4ff; border-color:rgba(0,212,255,.25); }
#track-name { font-size:.58rem; color:#6a4a8a; margin-top:2px; padding:0 11px; line-height:1.4; display:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#track-name.visible { display:block; }

#sidebar-overlay {
  display:none; position:fixed; inset:0; z-index:290;
  background:rgba(10,0,21,.45);
}
#sidebar-overlay.visible { display:block; }
#menu-btn {
  display:none; position:fixed; top:12px; right:14px; z-index:400;
  width:38px; height:38px; border-radius:8px;
  background:rgba(10,0,21,.9); border:1px solid rgba(255,107,214,.3);
  color:#ff6bd6; font-size:1.15rem; cursor:pointer;
  align-items:center; justify-content:center; padding:0;
  font-family:'Inter',sans-serif;
}
@media (max-width:767px) {
  #header { padding:10px 58px 6px 16px; }
  #header h1 { font-size:.8rem; letter-spacing:2px; }
  #header p  { font-size:.5rem; }
  #sidebar {
    left:-230px; top:0; bottom:0; width:220px;
    transition:left .25s ease; z-index:300;
    background:rgba(10,0,21,.98); padding-top:56px;
    border-right:1px solid rgba(255,107,214,.12);
  }
  #sidebar.open { left:0; }
  #menu-btn { display:flex; }
  #tooltip {
    left:10px !important; right:10px !important;
    bottom:16px !important; top:auto !important; max-width:none;
  }
}
</style>

<body>
<canvas id="canvas-bg"></canvas>
<button id="menu-btn">&#9776;</button>
<div id="sidebar-overlay"></div>
<div id="header">
  <h1>THE MAP LAB RESEARCH UNIVERSE</h1>
  <p>MORALITY, ALTRUISM, &amp; PROSOCIALITY &mdash; 44 PUBLICATIONS</p>
</div>
<div id="sidebar"><h3>Themes</h3></div>
<svg id="main-svg"></svg>
<div id="tooltip">
  <div class="tt-authors" id="tt-authors"></div>
  <div class="tt-journal" id="tt-journal"></div>
  <div class="tt-title"   id="tt-title"></div>
  <div class="tt-bridge"  id="tt-bridge" style="display:none"></div>
  <div class="tt-theme"   id="tt-theme"></div>
  <div class="tt-cite"    id="tt-cite"  style="display:none"></div>
  <div class="tt-click"   id="tt-click"></div>
</div>
<script>
// ── VAPORWAVE BACKGROUND ──────────────────────────────────────────────────
const cvs = document.getElementById('canvas-bg'), ctx = cvs.getContext('2d');
let stars = [];
let vTime = 0;
let starPivot = {x:0, y:0};
let shootingStars = [];
let nextShoot = 2;

function initStars() {
  cvs.width = innerWidth; cvs.height = innerHeight;
  // Celestial pole the sky rotates around (near top-center)
  starPivot = { x: cvs.width * 0.5, y: cvs.height * 0.04 };
  const maxR = Math.hypot(cvs.width, cvs.height * 0.7);
  stars = Array.from({length:280}, () => ({
    ang: Math.random()*Math.PI*2,
    rad: Math.random()*maxR,
    r:Math.random()*1.2+.2, a:Math.random()*.4+.08,
    spd:(Math.random()*.4+.06)*(Math.random()<.5?1:-1)
  }));
}

const buildings = [];
function initBuildings() {
  buildings.length = 0;
  const w = cvs.width;
  const scale = Math.min(w, cvs.height) / 900;
  for (let x = 0; x < w; x += Math.random()*25*scale + 10*scale) {
    const bw = (Math.random()*30 + 12) * scale;
    const bh = (Math.random()*80 + 20) * scale;
    buildings.push({x, w:bw, h:bh});
  }
}

function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }
function rgb(c){ return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`; }
function rgba(c,a){ return `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`; }

function drawVaporwave() {
  vTime += 0.016;
  const w = cvs.width, h = cvs.height;
  const horizonY = h * 0.52;
  const cycle = (Math.sin(vTime * 0.04) + 1) / 2;

  // Sky gradient
  const skyTop    = lerpColor([15,0,45],[8,0,30],cycle);
  const skyMid    = lerpColor([90,20,120],[50,10,80],cycle);
  const skyLow    = lerpColor([220,60,130],[180,40,150],cycle);
  const skyHorizon= lerpColor([255,140,80],[255,100,180],cycle);

  const skyGrad = ctx.createLinearGradient(0,0,0,horizonY);
  skyGrad.addColorStop(0, rgb(skyTop));
  skyGrad.addColorStop(0.35, rgb(skyMid));
  skyGrad.addColorStop(0.7, rgb(skyLow));
  skyGrad.addColorStop(1.0, rgb(skyHorizon));
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,w,horizonY);

  // Sun
  const sunR = Math.min(w,h) * 0.1;
  const sunX = w * 0.5;
  const sunY = horizonY - sunR * 0.15;
  const sunColor = lerpColor([255,160,80],[255,100,200],cycle);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,w,horizonY);
  ctx.clip();

  const sunGrad = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*1.4);
  sunGrad.addColorStop(0, rgba(sunColor,0.95));
  sunGrad.addColorStop(0.5, rgba(sunColor,0.6));
  sunGrad.addColorStop(0.8, rgba(lerpColor(sunColor,[255,0,200],0.3),0.2));
  sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX,sunY,sunR*1.4,0,Math.PI*2);
  ctx.fill();

  // Sun body with scanlines
  ctx.fillStyle = rgba(sunColor,0.9);
  ctx.beginPath();
  ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = 'destination-out';
  for (let y = sunY - sunR; y < sunY + sunR; y += 5) {
    const fade = Math.abs(y - sunY) / sunR;
    ctx.fillStyle = `rgba(0,0,0,${0.15 + fade*0.3})`;
    ctx.fillRect(sunX - sunR - 5, y, sunR*2+10, 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // Stars — slow celestial rotation around the pole; clipped to the sky
  const rot = vTime * 0.013;
  stars.forEach(s => {
    const sx = starPivot.x + Math.cos(s.ang + rot) * s.rad;
    const sy = starPivot.y + Math.sin(s.ang + rot) * s.rad;
    s.a += s.spd*0.007;
    if(s.a>0.6||s.a<0.05) s.spd*=-1;
    if (sy < 0 || sy > horizonY - 4 || sx < 0 || sx > w) return;
    // fade stars as they sink toward the horizon
    const horizonFade = Math.min(1, (horizonY - sy) / (horizonY * 0.18));
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a * horizonFade})`;
    ctx.fill();
  });

  // Shooting stars — occasional streaks across the upper sky
  if (vTime > nextShoot) {
    nextShoot = vTime + 3 + Math.random()*6;
    const startX = Math.random()*w*0.7 + w*0.15;
    const startY = Math.random()*horizonY*0.45;
    const dir = Math.random()<0.5 ? 1 : -1;
    shootingStars.push({
      x:startX, y:startY,
      vx: dir*(220+Math.random()*120), vy: 90+Math.random()*70,
      life:0, dur:0.9+Math.random()*0.5,
    });
  }
  shootingStars.forEach(sh => { sh.life += 0.016; sh.x += sh.vx*0.016; sh.y += sh.vy*0.016; });
  shootingStars = shootingStars.filter(sh => sh.life < sh.dur && sh.y < horizonY);
  shootingStars.forEach(sh => {
    const p = sh.life / sh.dur;
    const alpha = Math.sin(p*Math.PI);           // fade in then out
    const tailX = sh.x - sh.vx*0.06, tailY = sh.y - sh.vy*0.06;
    const grad = ctx.createLinearGradient(tailX, tailY, sh.x, sh.y);
    grad.addColorStop(0, 'rgba(0,212,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${alpha})`);
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(0,212,255,0.8)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(sh.x, sh.y); ctx.stroke();
    ctx.shadowBlur = 0;
  });

  // City skyline
  const buildColor = lerpColor([12,0,28],[8,0,20],cycle);
  ctx.fillStyle = rgb(buildColor);
  buildings.forEach(b => {
    ctx.fillRect(b.x, horizonY - b.h, b.w, b.h);
  });
  // Window lights
  buildings.forEach(b => {
    const cols = Math.floor(b.w / (6 * Math.min(w,h)/900));
    const rows = Math.floor(b.h / (10 * Math.min(w,h)/900));
    for (let r=0;r<rows;r++) {
      for (let c=0;c<cols;c++) {
        if (Math.random() > 0.35) continue;
        const wx = b.x + 3 + c*(b.w/cols);
        const wy = horizonY - b.h + 4 + r*(b.h/rows);
        ctx.fillStyle = rgba(lerpColor([255,200,100],[0,212,255],Math.random()),0.3+Math.random()*0.3);
        ctx.fillRect(wx, wy, 2, 2);
      }
    }
  });

  // Ground
  const gndGrad = ctx.createLinearGradient(0,horizonY,0,h);
  const gndTop = lerpColor([20,5,45],[15,0,35],cycle);
  const gndBot = lerpColor([8,0,20],[5,0,12],cycle);
  gndGrad.addColorStop(0, rgb(gndTop));
  gndGrad.addColorStop(1, rgb(gndBot));
  ctx.fillStyle = gndGrad;
  ctx.fillRect(0,horizonY,w,h-horizonY);

  // Perspective grid
  const vanishX = w*0.5, vanishY = horizonY;
  const gridCyan = lerpColor([0,180,255],[0,140,220],cycle);
  const gridPink = lerpColor([255,0,180],[200,0,160],cycle);

  // Vertical lines
  ctx.lineWidth = 1;
  const numV = 24;
  for (let i=-numV; i<=numV; i++) {
    const bottomX = vanishX + i*(w/numV)*1.8;
    const alpha = 0.15 - Math.abs(i/numV)*0.08;
    ctx.strokeStyle = rgba(gridCyan, Math.max(0.03,alpha));
    ctx.beginPath();
    ctx.moveTo(vanishX, vanishY);
    ctx.lineTo(bottomX, h);
    ctx.stroke();
  }

  // Horizontal lines (scrolling)
  const scrollOff = (vTime * 40) % 60;
  ctx.lineWidth = 1;
  for (let i=0; i<35; i++) {
    const raw = (i*60 + scrollOff) / (h - horizonY + 400);
    if (raw > 1.2) continue;
    const t = Math.pow(Math.min(raw,1), 2);
    const y = horizonY + t * (h - horizonY);
    const spread = t * w * 2;
    const alpha = t * 0.35;
    ctx.strokeStyle = rgba(gridPink, alpha);
    ctx.beginPath();
    ctx.moveTo(vanishX - spread, y);
    ctx.lineTo(vanishX + spread, y);
    ctx.stroke();
  }

  // Car (rear 3/4 view, driving away into the horizon, neon-outlined)
  const carScale = Math.min(w,h) / 620;
  const carW = 54 * carScale;
  const carH = 26 * carScale;
  const carX = w*0.5;
  const carY = h*0.86;
  const bob = Math.sin(vTime*4)*1.2*carScale;

  ctx.save();
  ctx.translate(0, bob);

  // Ground reflection glow under the car
  const reflGrad = ctx.createRadialGradient(carX, carY+4*carScale, 0, carX, carY+4*carScale, carW*0.9);
  reflGrad.addColorStop(0, 'rgba(255,0,120,0.25)');
  reflGrad.addColorStop(1, 'rgba(255,0,120,0)');
  ctx.fillStyle = reflGrad;
  ctx.beginPath();
  ctx.ellipse(carX, carY+4*carScale, carW*0.9, carH*0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // Car body (dark with neon rim light)
  ctx.fillStyle = rgba([20,2,38],0.96);
  ctx.strokeStyle = rgba([0,230,255],0.9);
  ctx.lineWidth = 1.8*carScale;
  ctx.shadowColor = 'rgba(0,230,255,0.7)';
  ctx.shadowBlur = 12*carScale;

  // lower body
  ctx.beginPath();
  ctx.moveTo(carX - carW/2, carY);
  ctx.lineTo(carX + carW/2, carY);
  ctx.lineTo(carX + carW*0.46, carY - carH*0.5);
  ctx.lineTo(carX - carW*0.46, carY - carH*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // cabin / roof
  ctx.beginPath();
  ctx.moveTo(carX - carW*0.36, carY - carH*0.5);
  ctx.lineTo(carX - carW*0.26, carY - carH);
  ctx.lineTo(carX + carW*0.26, carY - carH);
  ctx.lineTo(carX + carW*0.36, carY - carH*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba([0,230,255],0.9);
  ctx.shadowColor = 'rgba(0,230,255,0.7)';
  ctx.shadowBlur = 10*carScale;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // rear window (magenta glow)
  ctx.fillStyle = rgba([120,0,160],0.55);
  ctx.beginPath();
  ctx.moveTo(carX - carW*0.24, carY - carH*0.55);
  ctx.lineTo(carX - carW*0.17, carY - carH*0.92);
  ctx.lineTo(carX + carW*0.17, carY - carH*0.92);
  ctx.lineTo(carX + carW*0.24, carY - carH*0.55);
  ctx.closePath();
  ctx.fill();

  // Tail lights (full-width neon bar, pulsing)
  const tlGlow = 0.7 + Math.sin(vTime*3)*0.3;
  ctx.fillStyle = `rgba(255,20,90,${tlGlow})`;
  ctx.shadowColor = 'rgba(255,20,90,0.9)';
  ctx.shadowBlur = 16*carScale;
  ctx.fillRect(carX - carW*0.44, carY - carH*0.34, carW*0.3, 4*carScale);
  ctx.fillRect(carX + carW*0.14, carY - carH*0.34, carW*0.3, 4*carScale);
  // center connecting strip
  ctx.fillStyle = `rgba(255,40,110,${tlGlow*0.6})`;
  ctx.fillRect(carX - carW*0.44, carY - carH*0.34, carW*0.88, 1.5*carScale);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Headlight beams splaying onto the road ahead
  ctx.save();
  const beamGrad = ctx.createLinearGradient(carX, carY, carX, horizonY+30);
  beamGrad.addColorStop(0, 'rgba(255,230,200,0.12)');
  beamGrad.addColorStop(1, 'rgba(255,230,200,0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(carX - carW*0.4, carY - carH*0.5 + bob);
  ctx.lineTo(carX - carW*0.12, horizonY + 50);
  ctx.lineTo(carX + carW*0.12, horizonY + 50);
  ctx.lineTo(carX + carW*0.4, carY - carH*0.5 + bob);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  requestAnimationFrame(drawVaporwave);
}

// ── APA HELPERS ────────────────────────────────────────────────────────────
function buildAuthorStr(p) {
  const coList = COAUTHORS[p.n] || [];
  let names;
  if (p.first === 'Law') {
    names = ['Law', ...coList];
  } else if (coList.includes('Law')) {
    names = [p.first, ...coList];
  } else {
    names = [p.first, 'Law', ...coList.filter(n => n !== p.first)];
  }
  const fmt = names.map(n => INITIALS[n] ? `${n}, ${INITIALS[n]}` : n);
  if (fmt.length === 1) return fmt[0];
  if (fmt.length === 2) return `${fmt[0]} & ${fmt[1]}`;
  return fmt.slice(0, -1).join(', ') + ', & ' + fmt[fmt.length - 1];
}
function buildAPA(p) {
  const journal = JOURNAL_NAMES[p.abbr] || p.abbr;
  return `${buildAuthorStr(p)} (${p.year}). ${p.title}. <em>${journal}</em>.`;
}

const nodes = PAPERS.map(p => ({
  ...p,
  bridge:   BRIDGES[p.n] || null,
  cites:    CITES[p.n] ?? null,
  isLast:   LAST_PAPERS.has(p.n),
  isMentee: MENTEE_PAPERS.has(p.n),
  x: themeMap[p.theme].hx + (Math.random()-.5)*80,
  y: themeMap[p.theme].hy + (Math.random()-.5)*80,
}));

function boundaryForce() {
  nodes.forEach(d => {
    const hub = themeMap[d.theme];
    const dx = d.x - hub.hx, dy = d.y - hub.hy;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const maxD = HUB_R - PR - 8;
    if (dist > maxD && dist > 0) { d.x = hub.hx + dx/dist*maxD; d.y = hub.hy + dy/dist*maxD; d.vx *= 0.4; d.vy *= 0.4; }
  });
}

function illustForce() {
  nodes.forEach(d => {
    const hub = themeMap[d.theme];
    const dx = d.x - hub.hx, dy = d.y - hub.hy;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const minD = ILLUST_R + PR + 6;
    if (dist < minD && dist > 0) { const strength=(minD-dist)/minD*0.45; d.vx+=dx/dist*strength; d.vy+=dy/dist*strength; }
  });
}

  .force('y', d3.forceY(d=>themeMap[d.theme].hy).strength(0.16))
  .force('boundary', boundaryForce)
  .force('illust',   illustForce)
  .alpha(0.9).alphaDecay(0.015);

// ── BRIDGE ARCS ─────────────────────────────────────────────────────────────
let bridgePaths = null;
function buildBridges() {
  const bd = nodes.filter(d=>d.bridge);
  bridgePaths = gBridge.selectAll('path.barc').data(bd).join('path').attr('class','barc')
    .attr('fill','none')
    .attr('stroke', d=>`url(#bg-${d.n})`)
    .attr('stroke-width',1.8).attr('stroke-dasharray','5,4').attr('stroke-opacity',.65)
    .style('pointer-events','visibleStroke')
    .on('mouseover', showTip).on('mousemove', moveTip).on('mouseout', hideTip);
}
function updateBridges() {
  bridgePaths.each(function(d) {
    const sh = themeMap[d.bridge.secondary];
    const mx = (d.x+sh.hx)/2, my = (d.y+sh.hy)/2;
    const midX = (themeMap[d.theme].hx + sh.hx)/2;
    const midY = (themeMap[d.theme].hy + sh.hy)/2;
    const qx = mx + (midX-mx)*0.1 + (H/2-my)*0.08;
    const qy = my + (midY-my)*0.1 - (W/2-mx)*0.08;
    d3.select(this).attr('d',`M${d.x},${d.y} Q${qx},${qy} ${sh.hx},${sh.hy}`);
    const grad = document.getElementById(`bg-${d.n}`);
    if (grad) { grad.setAttribute('x1', d.x); grad.setAttribute('y1', d.y); grad.setAttribute('x2', sh.hx); grad.setAttribute('y2', sh.hy); }
  });
}

// ── TOOLTIP ─────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');
function showTip(ev,d) {
  const t = themeMap[d.theme];
  const authEl = document.getElementById('tt-authors');
  authEl.textContent=`${buildAuthorStr(d)} (${d.year}).`;
  authEl.style.color=t.color;
  authEl.style.textShadow=`0 0 8px ${t.color}44`;
  document.getElementById('tt-journal').textContent=JOURNAL_NAMES[d.abbr]||d.abbr;
  document.getElementById('tt-title').textContent=d.title;
  const be = document.getElementById('tt-bridge');
  if (d.bridge) { be.style.display='block'; be.style.color=themeMap[d.bridge.secondary].color; be.textContent=`Bridge: ${d.bridge.note}`; }
  else { be.style.display='none'; }
  document.getElementById('tt-theme').textContent=`${t.icon} ${t.name.replace('\n',' ')}` + (d.bridge ? ` ↔ ${themeMap[d.bridge.secondary].icon} ${themeMap[d.bridge.secondary].name.replace('\n',' ')}` : '');
  const citeEl = document.getElementById('tt-cite');
  if (d.cites != null) { citeEl.style.display='block'; citeEl.textContent=`≡ ${d.cites} citation${d.cites!==1?'s':''}  (Google Scholar)`; }
  else { citeEl.style.display='none'; }
  document.getElementById('tt-click').textContent = d.doi ? (isMobile ? 'Tap to open paper ↗' : 'Click to open paper ↗') : '';
  tip.classList.add('visible');
  moveTip(ev);
}
function moveTip(ev) {
  if (isMobile) return;
  let x=ev.clientX+16, y=ev.clientY-12;
  if(x+360>W) x=ev.clientX-375;
  if(y+200>H) y=H-205;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip() { tip.classList.remove('visible'); }

// ── FILTER ──────────────────────────────────────────────────────────────────
let activeTheme=null, showConn=false;

function nodeOpacity(d) {
  if (typeof menteeMode !== 'undefined' && menteeMode && !d.isMentee) return 0.06;
  if (activeTheme         && d.theme !== activeTheme)        return 0.06;
  if (typeof activeCollaborator !== 'undefined' && activeCollaborator && !(COAUTHORS[d.n]||[]).includes(activeCollaborator)) return 0.06;
  const inp = document.getElementById('search-input');
  if (inp) {
    const q = inp.value.trim().toLowerCase();
    if (q) return (d.title.toLowerCase().includes(q) || d.first.toLowerCase().includes(q) ||
                   d.abbr.toLowerCase().includes(q)  || String(d.year).includes(q)) ? 1 : 0.06;
  }
  return 1;
}
function refreshOpacity(dur=300) { pGs.transition().duration(dur).style('opacity', nodeOpacity); }

function filterTheme(tid) {
  if (activeTheme===tid) { resetFilter(); return; }
  activeTheme=tid;
  document.querySelectorAll('.theme-btn[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===tid));
  refreshOpacity();
  hubGs.transition().duration(300).style('opacity',d=>d.id===tid?1:0.22);
  if(bridgePaths) gBridge.selectAll('path.barc').transition().duration(300)
    .attr('stroke-opacity',d=>(d.theme===tid||(d.bridge&&d.bridge.secondary===tid))?0.85:0.05);
  sim.force('x',d3.forceX(d=>themeMap[d.theme].hx).strength(d=>d.theme===tid?0.38:0.10))
     .force('y',d3.forceY(d=>themeMap[d.theme].hy).strength(d=>d.theme===tid?0.38:0.10))
     .alpha(0.3).restart();
  showPaperList(tid);
}
function resetFilter() {
  activeTheme=null;
  document.querySelectorAll('.theme-btn[data-theme]').forEach(b=>b.classList.remove('active'));
  refreshOpacity();
  hubGs.transition().duration(300).style('opacity',1);
  if(bridgePaths) gBridge.selectAll('path.barc').transition().duration(300).attr('stroke-opacity',.65);
  sim.force('x',d3.forceX(d=>themeMap[d.theme].hx).strength(0.16))
     .force('y',d3.forceY(d=>themeMap[d.theme].hy).strength(0.16))
     .alpha(0.3).restart();
  hidePaperList();
}
function toggleConn() {
  showConn=!showConn;
  ct.innerHTML='<span style="text-shadow:0 0 8px #00d4ff,0 0 14px #00d4ff">✦</span>  '+(showConn?'Hide Cross-Topic Bridges':'Show Cross-Topic Bridges');
  ct.classList.toggle('on',showConn);
  cn.classList.toggle('visible',showConn);
  if(showConn){ if(!bridgePaths) buildBridges(); gBridge.style('display',null); updateBridges(); }
  else gBridge.style('display','none');
}

let menteeMode = false;
function toggleMenteeMode() {
  menteeMode = !menteeMode;
  document.getElementById('btn-mentee').classList.toggle('on', menteeMode);
  refreshOpacity();
}

let trajMode = false, trajBuilt = false, trajAnimating = false, trajAnimTimeout = null;
const sortedNodes = [...nodes].sort((a,b) => a.n - b.n);

function buildTrajectory() {
  gTrajectory.selectAll('*').remove();
  gTrajectory.selectAll('circle.traj-end').data([sortedNodes[0], sortedNodes[sortedNodes.length-1]]).join('circle')
    .attr('class','traj-end').attr('r', 22).attr('fill','none')
    .attr('stroke','rgba(255,255,255,0.82)').attr('stroke-width', 2.5)
    .style('opacity', 0);
  trajBuilt = true;
}
function updateTrajectory() {
  gTrajectory.selectAll('circle.traj-end').each(function(d) { d3.select(this).attr('cx',d.x).attr('cy',d.y); });
}
function animateTrajectory() {
  trajAnimating = true;
  pGs.style('opacity', d => d.n === sortedNodes[0].n ? 1 : 0.06);
  gTrajectory.selectAll('circle.traj-end').filter(d => d.n === sortedNodes[0].n)
    .transition().delay(250).duration(400).style('opacity', 1);
  let i = 0;
  const STEP = 68;
  function step() {
    if (!trajMode) { finishTrajAnimation(false); return; }
    if (i >= sortedNodes.length - 1) { finishTrajAnimation(true); return; }
    pGs.filter(d => d.n === sortedNodes[i + 1].n).transition().duration(80).style('opacity', 1);
    i++;
    trajAnimTimeout = setTimeout(step, STEP);
  }
  trajAnimTimeout = setTimeout(step, 500);
}
function finishTrajAnimation(completed) {
  trajAnimating = false;
  pGs.transition().duration(400).style('opacity', nodeOpacity);
  if (completed) { gTrajectory.selectAll('circle.traj-end').transition().duration(400).style('opacity', 1); }
}
function toggleTrajectory() {
  trajMode = !trajMode;
  document.getElementById('btn-traj').classList.toggle('on', trajMode);
  if (trajMode) {
    if (!trajBuilt) buildTrajectory();
    gTrajectory.selectAll('circle.traj-end').style('opacity', 0);
    gTrajectory.style('display', null);
    updateTrajectory();
    animateTrajectory();
  } else {
    if (trajAnimTimeout) clearTimeout(trajAnimTimeout);
    trajAnimating = false;
    gTrajectory.style('display', 'none');
    pGs.transition().duration(300).style('opacity', nodeOpacity);
  }
}

let collabMode = false, activeCollaborator = null;
const collabCounts = {};
Object.values(COAUTHORS).forEach(arr => arr.forEach(name => { if (name !== 'Law') collabCounts[name] = (collabCounts[name] || 0) + 1; }));
const TOP_COLLABS = Object.entries(collabCounts).sort((a,b) => b[1]-a[1]).slice(0,10);

function buildCollabList() {
  activeCollaborator = null;
  refreshOpacity();
  panel.innerHTML = '';
  const back = document.createElement('button');
  back.id = 'pl-back'; back.innerHTML = '← Close';
  back.onclick = () => { collabMode=false; document.getElementById('btn-collab').classList.remove('on'); activeCollaborator=null; refreshOpacity(); hidePaperList(); };
  panel.appendChild(back);
  const hdr = document.createElement('div');
  hdr.id = 'pl-heading'; hdr.style.color = '#00E5A0';
  hdr.textContent = '⁂ Top 10 Collaborators';
  panel.appendChild(hdr);
  const sub = document.createElement('div');
  sub.id = 'pl-count'; sub.textContent = 'Ranked by number of co-authored papers';
  panel.appendChild(sub);
  TOP_COLLABS.forEach(([name, count]) => {
    const item = document.createElement('div');
    item.className = 'pl-item'; item.style.cursor = 'pointer';
    item.innerHTML = `<div class="pl-meta" style="color:#00E5A0">${name}<span style="float:right;color:#6a8aaa">${count} paper${count>1?'s':''}</span></div>`;
    item.onclick = () => filterByCollaborator(name);
    panel.appendChild(item);
  });
  panel.classList.add('visible');
}
function showCollabPanel() {
  collabMode = !collabMode;
  document.getElementById('btn-collab').classList.toggle('on', collabMode);
  if (!collabMode) { activeCollaborator=null; refreshOpacity(); hidePaperList(); return; }
  buildCollabList();
}
function filterByCollaborator(name) {
  activeCollaborator = name;
  refreshOpacity();
  const papers = PAPERS.filter(p => (COAUTHORS[p.n]||[]).includes(name)).sort((a,b) => b.year-a.year);
  panel.innerHTML = '';
  const back = document.createElement('button');
  back.id = 'pl-back'; back.innerHTML = '← Top collaborators';
  back.onclick = () => { activeCollaborator=null; refreshOpacity(); buildCollabList(); };
  panel.appendChild(back);
  const hdr = document.createElement('div');
  hdr.id = 'pl-heading'; hdr.style.color = '#00E5A0';
  hdr.textContent = `⁂ ${name}`;
  panel.appendChild(hdr);
  const cnt = document.createElement('div');
  cnt.id = 'pl-count'; cnt.textContent = `${papers.length} co-authored paper${papers.length>1?'s':''}`;
  panel.appendChild(cnt);
  papers.forEach(p => {
    const item = document.createElement('div');
    item.className = 'pl-item';
    if (p.doi) item.dataset.doi = '1';
    const tc = themeMap[p.theme].color;
    const citeStr = CITES[p.n] != null ? `<span style="color:${tc};opacity:.6;float:right">${CITES[p.n]} cit.</span>` : '';
    item.innerHTML = `<div class="pl-meta" style="color:${tc}">${buildAuthorStr(p)} (${p.year}).${citeStr}</div><div class="pl-journal">${JOURNAL_NAMES[p.abbr]||p.abbr}</div><div class="pl-title">${p.title}</div>`;
    if (p.doi) item.onclick = () => window.open(p.doi, '_blank');
    panel.appendChild(item);
  });
  panel.classList.add('visible');
}

let citeMode = false;
function setLabelMode(mode) {
  pGs.select('text.year-lbl').style('display',  mode==='year' ? null : 'none');
  pGs.select('text.cite-label').style('display', mode==='cite' ? null : 'none');
}
function toggleCiteMode() {
  citeMode = !citeMode;
  document.getElementById('btn-cite').classList.toggle('on', citeMode);
  pGs.select('circle.cite-aura').style('display', citeMode ? null : 'none');
  if (citeMode) {
    pGs.select('circle.cite-aura')
      .attr('filter', 'url(#neon-glow)')
      .transition().duration(600)
      .attr('fill-opacity', d => d.cites ? Math.min(0.08 + d.cites*0.002, 0.3) : 0.05)
      .attr('stroke-opacity', d => d.cites ? Math.min(0.2 + d.cites*0.004, 0.6) : 0.1);
  } else {
    pGs.select('circle.cite-aura').attr('filter', null);
  }
  gHubs.selectAll('text.hub-cite-total').style('display', citeMode ? null : 'none');
  setLabelMode(citeMode ? 'cite' : 'year');
}

function showPaperList(tid) {
  const t = themeMap[tid];
  const papers = PAPERS.filter(p=>p.theme===tid).sort((a,b)=>b.year-a.year || a.first.localeCompare(b.first));
  panel.innerHTML='';
  const back=document.createElement('button');
  back.id='pl-back'; back.innerHTML='← All themes'; back.onclick=resetFilter;
  panel.appendChild(back);
  const hdr=document.createElement('div');
  hdr.id='pl-heading'; hdr.style.color=t.color;
  hdr.textContent=`${t.icon}  ${t.name}`;
  panel.appendChild(hdr);
  const totalCites = papers.reduce((s,p)=>s+(CITES[p.n]||0),0);
  const cnt=document.createElement('div');
  cnt.id='pl-count';
  cnt.innerHTML=`${papers.length} papers &nbsp;·&nbsp; <span style="color:${t.color};opacity:.8">${totalCites.toLocaleString()} total citations</span>`;
  panel.appendChild(cnt);
  papers.forEach(p=>{
    const item=document.createElement('div');
    item.className='pl-item';
    if(p.doi) item.dataset.doi='1';
    const citeStr = CITES[p.n] != null ? `<span style="color:${t.color};opacity:.6;float:right">${CITES[p.n]} cit.</span>` : '';
    item.innerHTML=`<div class="pl-meta" style="color:${t.color}">${buildAuthorStr(p)} (${p.year}).${citeStr}</div><div class="pl-journal">${JOURNAL_NAMES[p.abbr]||p.abbr}</div><div class="pl-title">${p.title}</div>`;
    if(p.doi) item.onclick=()=>window.open(p.doi,'_blank');
    panel.appendChild(item);
  });
  panel.classList.add('visible');
}
function hidePaperList() { panel.classList.remove('visible'); }

let searchActive = false;
function toggleSearch() {
  searchActive = !searchActive;
  document.getElementById('btn-search').classList.toggle('on', searchActive);
  const inp = document.getElementById('search-input');
  inp.classList.toggle('visible', searchActive);
  if (searchActive) { inp.focus(); } else { inp.value=''; doSearch(''); }
}
function doSearch(q) { refreshOpacity(200); }

const menuBtn    = document.getElementById('menu-btn');
const sidebarEl  = document.getElementById('sidebar');
const sidebarOvl = document.getElementById('sidebar-overlay');
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOvl.classList.remove('visible'); menuBtn.textContent = '☰'; }
menuBtn.addEventListener('click', () => {
  const opening = !sidebarEl.classList.contains('open');
  sidebarEl.classList.toggle('open', opening);
  sidebarOvl.classList.toggle('visible', opening);
  menuBtn.textContent = opening ? '✕' : '☰';
});
sidebarOvl.addEventListener('click', closeSidebar);

</script>
